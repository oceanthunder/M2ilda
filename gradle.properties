# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# DJI MSDK 4.x ships bytecode that D8's full/dexing-mode mangles (constructor
# verifier errors like "Constructor returning without calling superclass").
# Disabling fullMode uses the legacy D8 behavior that preserves DJI's code.
android.enableD8.fullMode=false