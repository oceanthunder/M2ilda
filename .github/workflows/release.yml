name: Build and publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_PATH" > local.properties
          if [ -x "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          VERSION="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "RELEASE_TAG=$VERSION" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "M2ilda-${RELEASE_TAG}.apk"
          # Stable name so the README download button can always point at
          # /releases/latest/download/M2ilda-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk "M2ilda-latest.apk"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: M2ilda-*.apk
          body: |
            M2ilda - web ground control for the DJI Mavic 2 Enterprise.

            Requires a DJI API key registered for package `com.example.m2ilda`;
            enter it in the app on first launch. Uninstall older Mavic 2 Gateway
            builds first, as this is a new Android app ID.
          generate_release_notes: true
